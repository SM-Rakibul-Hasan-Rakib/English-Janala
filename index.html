<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title and logo -->
    <title>English Janala | Brest Platform for learning English</title>
    <link rel="shortcut icon" href="/assets/logo.png" type="image/x-icon" />

    <!-- font-awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- font integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Exo+2:ital,wght@0,100..900;1,100..900&family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- tailwindcss and daisy ui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- stylesheet -->
    <link rel="stylesheet" href="/style/style.css" />
  </head>
  <body>
    <header class="">
      <div class="navbar bg-base-100 shadow-sm">
        <div class="navbar-start">
          <div class="dropdown">
            <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h8m-8 6h16"
                />
              </svg>
            </div>
            <ul
              tabindex="-1"
              class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow"
            >
              <li>
                <a class="" href=""
                  ><i class="fa-solid text-xl fa-circle-question"></i>FAQ</a
                >
              </li>
              <li>
                <a class="" href=""
                  ><i class="fa-solid text-xl fa-book-open"></i>Learn</a
                >
              </li>
              <li>
                <a class="" href=""
                  ><i class="fa-solid text-xl fa-arrow-right-from-bracket"></i
                  >Logout</a
                >
              </li>
            </ul>
          </div>
          <a href="" class="normal-case ml-5 flex text-xl gap-1"
            ><span class="text-lg font-bold">English</span>
            <img src="/assets/logo.png" alt="" />
            <span class="font-bangla font-semibold">জানালা</span>
          </a>
        </div>
        <div class="navbar-end hidden mr-5 lg:flex">
          <ul class="menu menu-horizontal px-1 space-x-4">
            <li>
              <a class="btn btn-outline btn-primary" href=""
                ><i class="fa-solid text-xl fa-circle-question"></i>FAQ</a
              >
            </li>
            <li>
              <a class="btn btn-outline btn-primary" href=""
                ><i class="fa-solid text-xl fa-book-open"></i>Learn</a
              >
            </li>
            <li>
              <a class="btn btn-outline btn-primary" href=""
                ><i class="fa-solid text-xl fa-arrow-right-from-bracket"></i
                >Logout</a
              >
            </li>
          </ul>
        </div>
      </div>
    </header>
    <section
      class="w-11/12 mx-auto min-h-[80vh] flex flex-col-reverse lg:flex-row items-center justify-center gap-10"
    >
      <!-- Content -->
      <div class="content w-full lg:w-[40%] text-center lg:text-left">
        <h2 class="text-4xl md:text-5xl font-bold mb-4">
          <span class="text-sky-500">English</span> is Easy!!
        </h2>

        <p class="text-base md:text-lg leading-relaxed mb-8">
          আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন। আপনি যদি নতুন হন অথবা
          আপনার দক্ষতা বাড়াতে চান, আমাদের Interactive Lessons আপনাকে নিয়ে যাবে
          অন্য একটি Level এ।
        </p>

        <div class="space-y-3 max-w-sm mx-auto lg:mx-0">
          <input
            type="text"
            placeholder="Enter Your Name"
            class="w-full border border-gray-300 rounded-md px-4 py-3"
          />

          <input
            type="password"
            placeholder="********"
            class="w-full border border-gray-300 rounded-md px-4 py-3"
          />

          <button
            class="bg-indigo-600 text-white px-6 py-3 rounded-md font-medium"
          >
            Get Started
          </button>
        </div>
      </div>

      <!-- Image -->
      <div class="w-full lg:w-[60%] flex justify-center items-center">
        <img
          src="/assets/rakib.jpg"
          alt="English Learning"
          class="h-[300px] md:h-[450px] lg:h-[650px] xl:h-[750px] w-auto object-contain"
        />
      </div>
    </section>
  </body>
</html>
